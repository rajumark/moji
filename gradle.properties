#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx4096M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Published coordinates:  implementation("$GROUP:$POM_ARTIFACT_ID:$VERSION_NAME") ----
# Same artifact id as the Android-only 1.x releases: Gradle metadata picks moji-android,
# moji-jvm, moji-iosarm64, ... for each consumer platform.
GROUP=io.github.rajumark
POM_ARTIFACT_ID=moji
VERSION_NAME=2.0.0

# ---- POM metadata (required by Maven Central) ----
POM_NAME=Moji
POM_DESCRIPTION=Moji by Hoverfly: on-device text to emoji suggestions for Kotlin Multiplatform (Android, iOS, macOS, JVM, JS, Wasm). 22+ languages, ~5 MB, no dependencies, no network.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/rajumark/moji
POM_LICENSE_NAME=Hoverfly Community License 1.0
POM_LICENSE_URL=https://github.com/rajumark/moji/blob/main/LICENSE
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/rajumark/moji
POM_SCM_CONNECTION=scm:git:git://github.com/rajumark/moji.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/rajumark/moji.git
POM_DEVELOPER_ID=rajumark
POM_DEVELOPER_NAME=rajumark
POM_DEVELOPER_URL=https://github.com/rajumark
