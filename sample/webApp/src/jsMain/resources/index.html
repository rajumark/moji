<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moji Web</title>
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <h1>Moji</h1>
    <p id="platform" class="muted"></p>
    <input id="text" placeholder="Type a task or a message" autocomplete="off">
    <div id="examples" class="row"></div>
    <section class="card">
        <h2>Suggestions</h2>
        <div id="emoji"></div>
        <p id="timing" class="muted small"></p>
    </section>
    <h2>Skin tone</h2>
    <div id="tones" class="row"></div>
    <h2>Why these</h2>
    <div id="why"></div>
    <p id="load" class="muted small"></p>
</main>
<script type="application/javascript" src="webApp.js"></script>
</body>
</html>
